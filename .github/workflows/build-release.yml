name: 星环 Roam · 构建并发布 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签（留空则用 pubspec.yaml 的版本号，例如 v1.0.30）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: 构建 APK / HAP 并发布
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 缓存工具链与依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/roam-ci
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: roam-build-v1-${{ hashFiles('pubspec.yaml', 'pubspec.lock', 'tool/ci_build.sh', '.github/workflows/build-release.yml') }}
          restore-keys: |
            roam-build-v1-

      - name: 构建 Android APK（arm64 / arm32）
        run: bash tool/ci_build.sh android

      - name: 构建 HarmonyOS NEXT HAP（未签名）
        run: bash tool/ci_build.sh hap

      - name: 计算发布标签
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(awk -F'[:+]' '/^version:/ {gsub(/[ \t]/, "", $2); print $2; exit}' pubspec.yaml)"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "发布标签: $TAG"

      - name: 创建 Release 并上传 APK / HAP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 星环 Roam ${{ steps.meta.outputs.tag }}
          files: |
            dist/*.apk
            dist/*.hap
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
